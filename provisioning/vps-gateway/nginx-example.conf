# Example nginx config: serves web-wallet statically and reverse-proxies
# the gateway API, both under one TLS-terminated hostname (so the browser
# same-origins the two and GATEWAY_CORS_ORIGINS can be tightened to just
# this hostname instead of "*"). Not installed by provision.sh -- TLS
# termination is left as a deliberate separate step, see that script's
# closing message for why.
#
# Adjust server_name and the web-wallet root path, obtain a cert (e.g.
# certbot --nginx -d wallet.codexacoin.example), then:
#   cp nginx-example.conf /etc/nginx/sites-available/cac-wallet
#   ln -s /etc/nginx/sites-available/cac-wallet /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name wallet.codexacoin.example;

    ssl_certificate     /etc/letsencrypt/live/wallet.codexacoin.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet.codexacoin.example/privkey.pem;

    root /opt/cac-gateway/web-wallet;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8080/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name wallet.codexacoin.example;
    location / { return 301 https://$host$request_uri; }
}
