# Example nginx config for the explorer: serves the static frontend and
# reverse-proxies /api/ to the backend, both under one origin (so
# explorer/app.js's same-origin "/api" default -- see its own comment --
# just works with no CORS setup needed). Not installed by provision.sh,
# same reasoning as ../vps-gateway/nginx-example.conf.
#
#   cp nginx-example.conf /etc/nginx/sites-available/cac-explorer
#   ln -s /etc/nginx/sites-available/cac-explorer /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name explorer.codexacoin.example;

    ssl_certificate     /etc/letsencrypt/live/explorer.codexacoin.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/explorer.codexacoin.example/privkey.pem;

    root /opt/cac-explorer/explorer;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name explorer.codexacoin.example;
    location / { return 301 https://$host$request_uri; }
}
