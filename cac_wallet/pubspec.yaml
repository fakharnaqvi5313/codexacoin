name: cac_wallet
description: >
  CodexaCoin (CAC) light wallet -- Android + iOS, one Flutter codebase.
  Key generation/storage and transaction signing happen entirely
  on-device; the app performs NO mining, staking, or background
  processing (see ../docs/store-compliance.md). All staking happens on
  the VPS staking service (Phase 6) via the gateway API specified in
  ../docs/mobile-api.md.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # -- Key derivation --
  # BIP39 mnemonic generation/validation and seed derivation.
  bip39: ^1.0.6
  # Generic BIP32 HD key derivation (secp256k1). Not Bitcoin-specific by
  # itself -- CAC's address encoding (Base58Check with our own version
  # bytes, bech32 with HRP "cac") is implemented in lib/crypto/ rather
  # than depending on a higher-level Bitcoin-family package, since those
  # packages are built for standard Bitcoin-derived coins and CAC's PoS
  # coinstake transaction format is genuinely nonstandard (see
  # lib/crypto/README in-code notes). Ordinary (non-coinstake) sends are
  # wire-compatible with standard nVersion=2 Bitcoin transactions, which
  # is the only kind this wallet ever constructs -- it never builds a
  # coinstake, by design (no on-device staking).
  bip32: ^2.0.0
  pointycastle: ^3.9.1 # secp256k1 ECDSA, SHA256, RIPEMD160
  bs58check: ^1.0.2    # Base58Check, used for CAC address encoding
  bech32: ^0.2.2        # bech32/bech32m, for the "cac"/"tcac" HRP

  # -- Secure storage (Keychain / Keystore, see docs/store-compliance.md) --
  flutter_secure_storage: ^9.2.2

  # -- QR --
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1 # pinned below 5.2.0's Dart >=3.4.0 bump; this SDK is Dart 3.3.4

  # -- Biometric app lock --
  local_auth: ^2.3.0

  # -- Networking (gateway API, see docs/mobile-api.md) --
  http: ^1.2.2

  # -- Opening the block explorer / other external links --
  url_launcher: ^6.3.0

  # -- BNB Chain "Connect Wallet & Swap": connects to the user's own external
  # wallet (MetaMask etc.) via WalletConnect rather than this app holding
  # any BSC keys itself -- see PARAMETERS.md section 31 for why. reown_appkit
  # is the current (2026) Flutter SDK for the dApp side of WalletConnect,
  # successor to the deprecated walletconnect_flutter_v2/web3modal_flutter.
  # web3dart is used only for ABI-encoding the PancakeSwap Router calldata
  # (approve/swapExactTokensForTokens) -- never for holding keys or signing;
  # signing happens entirely in the connected external wallet.
  reown_appkit: ^1.2.0 # pinned below 1.4.0's intl ^0.20.1 / 1.6.0's Dart >=3.8.0 bumps; this SDK is Dart 3.3.4
  web3dart: ^2.7.3

  # -- Sharing exported CSV history via the OS share sheet --
  share_plus: ^9.0.0 # pinned below 10.0.1's Dart >=3.4.0 bump; this SDK is Dart 3.3.4

  # -- State management (kept deliberately simple for this phase) --
  provider: ^6.1.2

  # -- misc --
  convert: ^3.1.1
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# reown_appkit pulls in appcheck (used to detect installed wallet apps) as a
# hard, non-optional dependency. appcheck >=1.6.0 requires Kotlin 2.2.21 and
# AGP 8.13.1 on the Android side, which this project's pinned Kotlin
# 1.7.10 / AGP 7.3.0 / Gradle 7.6.3 toolchain can't compile -- confirmed by
# `flutter build apk --release` failing in :appcheck:compileReleaseKotlin
# with binary-metadata-version errors. 1.5.4+1 is the newest release still
# on the older Kotlin 1.6.10 / AGP 4.1.3 toolchain, which this project's
# already-newer pins comfortably satisfy. Bumping the whole project's
# Kotlin/AGP/Gradle (and its minSdk, which appcheck >=1.6.0 also raises to
# 24) for one optional wallet-detection feature was judged out of scope for
# this change; see PARAMETERS.md section 31.
dependency_overrides:
  appcheck: 1.5.4+1

flutter:
  uses-material-design: true
